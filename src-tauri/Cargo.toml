[package]
name = "zavro-client"
version = "1.0.0"
description = "Zavro Client — native Linux desktop proxy client (Tauri v2 + Xray-core)"
authors = ["Zavro"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "zavro_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"

[profile.release]
lto = true
codegen-units = 1
